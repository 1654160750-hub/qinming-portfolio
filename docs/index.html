<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEE8DA">
  <meta name="description" content="秦铭的个人作品集：简历、专业技能、账号运营、剪辑作品、网页 / H5 / APP 设计与自媒体。">
  <meta property="og:title" content="秦铭 · 个人作品集">
  <meta property="og:description" content="编导、拍摄剪辑、新媒体运营，以及网页 / H5 / APP 作品。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="media/portrait.webp">
  <title>秦铭 · 个人作品集</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311120f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c7f000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
  <header class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a class="brand" href="#hero"><span class="brand-dot"></span><span id="brandName">秦铭</span> / <span id="brandLabel">PORTFOLIO</span></a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="打开导航">菜单</button>
      <nav class="nav-links" id="navLinks" aria-label="主导航">
        <a href="#resume">简历</a><a href="#skills">技能</a><a href="#accounts">账号运营</a><a href="#editing">剪辑</a><a href="#web">网页</a><a href="#h5">H5</a><a href="#app">APP</a><a href="#selfmedia">自媒体</a><a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero scene" id="hero">
      <div class="hero-bg" aria-hidden="true">
        <span class="bg-paper"></span>
        <span class="bg-grid"></span>
        <span class="bg-circle"></span>
        <span class="bg-word">PORTFOLIO</span>
        <span class="bg-tape tape-a"></span>
        <span class="bg-tape tape-b"></span>
      </div>
      <div class="hero-content page-shell">
        <div class="hero-head">
          <p class="status-pill" id="personLocation">北京 · BEIJING</p>
          <h1 class="hero-title">
            <span class="hero-name-big" id="personName">秦铭</span>
            <span class="hero-name-en" data-shadow="QIN MING">QIN MING</span>
          </h1>
          <p class="hero-role" id="personRole"></p>
        </div>
        <div class="hero-copy">
          <div class="chip-row" id="personChips"></div>
          <div class="hero-stats" id="heroStats"></div>
          <p class="hero-intro" id="personIntro"></p>
          <div class="hero-actions" id="heroActions"></div>
        </div>
        <figure class="portrait-wrap">
          <img id="portrait" src="media/portrait.webp" alt="秦铭的个人照片" width="880" height="1100">
          <figcaption>QIN MING / 2026</figcaption>
        </figure>
      </div>
    </section>

    <section class="resume scene tone-1" id="resume">
      <div class="page-shell section-shell">
        <div class="section-heading has-illo">
          <div class="heading-text">
            <p class="eyebrow">01 / 09</p>
            <div class="crown" data-shadow="RESUME">RESUME</div>
            <h2>简历</h2>
          </div>
          <figure class="illo-stage"><img class="section-illo" src="media/illo-resume.png" alt="手持简历与纸片的拼贴风人物插画" width="746" height="900" loading="lazy" decoding="async"></figure>
        </div>
        <div class="resume-grid">
          <dl class="resume-basics" id="resumeBasics"></dl>
          <article class="edu-card" id="resumeEdu"></article>
        </div>
        <div class="jobs" id="resumeJobs"></div>
      </div>
    </section>

    <section class="skills scene tone-2" id="skills">
      <div class="page-shell section-shell">
        <div class="section-heading has-illo">
          <div class="heading-text">
            <p class="eyebrow">02 / 09</p>
            <div class="crown" data-shadow="SKILLS">SKILLS</div>
            <h2>个人技能</h2>
          </div>
          <figure class="illo-stage"><img class="section-illo" src="media/illo-shooting.png" alt="手持相机、胶片与照片环绕的拼贴风人物插画" width="800" height="900" loading="lazy" decoding="async"></figure>
        </div>
        <div class="about-grid" id="skillGrid"></div>
      </div>
    </section>

    <section class="accounts scene tone-3" id="accounts">
      <div class="page-shell section-shell">
        <div class="section-heading has-illo">
          <div class="heading-text">
            <p class="eyebrow">03 / 09</p>
            <div class="crown long" data-shadow="ACCOUNT OPERATION">ACCOUNT OPERATION</div>
            <h2>账号运营</h2>
            <p>从起号、选题到数据复盘，用结果说话。</p>
          </div>
          <figure class="illo-stage"><img class="section-illo" src="media/illo-accounts.png" alt="手持数据板、增长曲线环绕的拼贴风人物插画" width="597" height="900" loading="lazy" decoding="async"></figure>
        </div>
        <div class="account-grid" id="accountGrid"></div>
      </div>
    </section>

    <div id="workSections"></div>

    <section class="contact scene" id="contact">
      <div class="page-shell contact-layout">
        <div class="contact-copy">
          <p class="eyebrow">09 / 09</p>
          <div class="crown" data-shadow="CONTACT">CONTACT</div>
          <h2 id="contactHeading"></h2>
          <p id="contactDescription"></p>
          <div class="contact-actions">
            <a id="emailLink" href="mailto:1654160750@qq.com"></a>
            <a id="socialLink" href="tel:13522486458"></a>
          </div>
        </div>
        <figure class="illo-stage"><img class="contact-illo" src="media/illo-contact.png" alt="递出信封与纸飞机的拼贴风人物插画" width="700" height="900" loading="lazy" decoding="async"></figure>
      </div>
    </section>
  </main>

  <footer><p><span id="footerName">秦铭</span> · BUILT WITH CURIOSITY</p></footer>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
